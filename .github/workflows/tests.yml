# Gate 5 in FACTORY-DIAGRAM.md: the test suite runs on every PR and on main, so "tests green" is a check, not a claim.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (offline, AGENTS.md rule 4)
        run: python -m pytest -q
